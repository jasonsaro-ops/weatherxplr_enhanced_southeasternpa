# Deploy Storm 3D + Visual Crossing proxy Worker
name: Deploy Storm 3D Worker

on:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-storm3d-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Sync Visual Crossing API key to Cloudflare
        if: ${{ secrets.VC_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VC_API_KEY: ${{ secrets.VC_API_KEY }}
        run: |
          echo "$VC_API_KEY" | npx wrangler secret put VC_API_KEY

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
