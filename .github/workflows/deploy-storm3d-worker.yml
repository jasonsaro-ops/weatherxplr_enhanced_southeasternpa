# Deploy Storm 3D Cloudflare Worker on every push that touches worker/
name: Deploy Storm 3D Worker

on:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-storm3d-worker.yml"
  workflow_dispatch: # manual "Run workflow" button

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          # Create this secret in the GitHub repo (see README)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional if token is account-scoped and needs an ID:
          # CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
